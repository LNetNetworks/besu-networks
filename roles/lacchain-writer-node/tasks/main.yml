---
- name: set mainnet as network chosen
  set_fact:
    network: "mainnet"
  when: (networkT == '0')

- name: set open-protestnet as network chosen
  set_fact:
    network: "openprotestnet"
  when: (networkT == '1')

- name: reject deprecated legacy-protestnet network
  fail:
    msg: "legacy-protestnet (networkT='2') was deprecated and removed. Choose mainnet-omega (0) or open-protestnet (1)."
  when: (networkT == '2')

- name: setting besu version (open-protestnet / testnet)
  set_fact:
    besu_release_version: "23.10.2"
  when: (networkT == '1')

- name: Deploying node
  debug:
    msg: You are deploying a WRITER on {{network}}

# El nodo vive en /root/lacchain (instalaciones con este Ansible) o en /apps/lacchain (disco de
# datos aparte). En una instalación nueva no existe ninguno y se usa /root/lacchain.
- name: Resolve besu home directory (prefer ~/lacchain, fallback /apps/lacchain)
  shell: |
    if [ -d "$HOME/lacchain" ]; then echo "$HOME/lacchain";
    elif [ -d /apps/lacchain ]; then echo /apps/lacchain;
    else echo "$HOME/lacchain"; fi
  register: besu_home_result
  changed_when: false

- name: Set besu_home fact
  set_fact:
    besu_home: "{{ besu_home_result.stdout }}"

- name: get public ip
  shell: dig +short myip.opendns.com @resolver1.opendns.com 2>/dev/null || curl -s --retry 2 icanhazip.com
  register: ip_address
  when: node_ip is not defined

- name: setting ip to use
  set_fact:
    node_ip: "{{ip_address.stdout}}"
  when: node_ip is not defined

- name: Install Writer Node
  import_tasks: "install.yaml"
  when: install | default(False) | bool

- name: Update Writer Node
  import_tasks: "update.yaml"
  when: update | default(False) | bool
