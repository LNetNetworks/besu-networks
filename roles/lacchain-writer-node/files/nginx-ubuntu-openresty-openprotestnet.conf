
user www-data;
worker_processes auto;
#pid /run/nginx.pid;
#include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 768;
	# multi_accept on;
}

http {
        include       /usr/local/openresty/nginx/conf/mime.types;
        default_type  application/octet-stream;

        log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

        access_log  /usr/local/openresty/nginx/logs/access.log  main;

        sendfile        on;
        #tcp_nopush     on;

        keepalive_timeout  65;
 
        #gzip  on;

	# gzip_vary on;
	# gzip_proxied any;
	# gzip_comp_level 6;
	# gzip_buffers 16 8k;
	# gzip_http_version 1.1;
	# gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

	##
	# Virtual Host Configs
	##

     server {
        listen 80;
        server_name localhost;
        location / {
           client_max_body_size       5m;
           client_body_buffer_size    1m;
           set $proxy "";
           rewrite_by_lua_block {
                local s = '(eth_sendRawTransaction|eth_getTransactionReceipt|eth_getTransactionCount|eea_sendRawTransaction|relay_getMetaTxResult)'
                ngx.req.read_body()
                local match = ngx.re.match(ngx.var.request_body,s)

                if match then
                       ngx.var.proxy = "127.0.0.1:9001"
                else
                       ngx.var.proxy = "127.0.0.1:4545"
                end
                }

                proxy_pass http://$proxy$uri;
        }

        # Rutas REST del relay-signer.
        #
        # El `location /` de arriba rutea por METODO JSON-RPC: lee el body y busca la regex. Un GET
        # a estas rutas no trae metodo, no matchea, y termina en besu, que responde 404. Por eso van
        # explicitas: un cliente las alcanza por el MISMO endpoint que usa para relayar, sin tener
        # que conocer el :9001.
        #
        # El monitor (/dashboard y /dashboard/stream) SI se expone aca, por decision del operador.
        # ATENCION: no tiene autenticacion y publica el `from` de cada usuario, los hashes y el gas
        # de todas las metatx que pasan por este nodo. Queda al alcance de cualquiera que llegue al
        # puerto 80. Si eso no es aceptable para un despliegue, la forma de cerrarlo es sacar estas
        # dos locations -se vuelve a llegar al monitor por el :9001 desde la red interna o por un
        # tunel- o restringirlas por IP.
        location = /info {
           proxy_pass http://127.0.0.1:9001;
        }

        location /nonce/ {
           proxy_pass http://127.0.0.1:9001;
        }

        location = /relay {
           client_max_body_size       5m;
           client_body_buffer_size    1m;
           # /relay responde recien cuando la metatx se mina, y en esta red eso tarda. El plazo se
           # deja por encima del `receiptTimeoutMs` del relay-signer (60 s por defecto) para que al
           # cliente le llegue el RECEIPT_TIMEOUT del servicio -que trae el hash- y no un 504 de
           # nginx, que no le dice si la metatx se envio.
           proxy_read_timeout         120s;
           proxy_pass http://127.0.0.1:9001;
        }

        location = /dashboard {
           proxy_pass http://127.0.0.1:9001;
        }

        location = /dashboard/stream {
           # SSE: el servicio manda eventos de a uno y no cierra la respuesta. Sin esto nginx
           # bufferea y la pagina se queda vacia hasta que se llena un buffer que nunca se llena.
           proxy_http_version         1.1;
           proxy_set_header           Connection "";
           proxy_buffering            off;
           proxy_cache                off;
           gzip                       off;
           chunked_transfer_encoding  off;
           # El flujo dura lo que dure la pestana abierta; el default de 60s lo cortaria solo.
           proxy_read_timeout         3600s;
           proxy_pass http://127.0.0.1:9001;
        }

        location /gas-relay-signer {
           proxy_pass http://127.0.0.1:9001;
        }
    }

	include /usr/local/openresty/nginx/conf.d/*.conf;
#	include /etc/nginx/sites-enabled/*;
}